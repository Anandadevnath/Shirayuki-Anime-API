# Render blueprint: the API as one free web service.
# Dashboard: New > Blueprint > this repo.
# Free plan: 512 MB RAM, 0.1 CPU, sleeps after 15 min without requests.
services:
  - type: web
    name: shirayuki-anime-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
